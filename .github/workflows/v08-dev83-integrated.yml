  native-launch:
    if: github.ref == 'refs/heads/qualification/v08-dev83-integrated' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: audit
            flags: ''
          - profile: dss
            flags: '--native-dss'
          - profile: pause-probe
            flags: '--native-pause-probe'
          - profile: thread-barrier
            flags: '--native-thread-barrier'
          - profile: child-gate
            flags: '--native-child-gate'
          - profile: native-prompts
            flags: '--native-prompts'
          - profile: native-handoff
            flags: '--native-handoff'
          - profile: native-ide
            flags: '--native-ide'
          - profile: native-terminal
            flags: '--native-terminal'
          - profile: native-startup-stress
            flags: '--native-startup-stress'
          - profile: listener-survival
