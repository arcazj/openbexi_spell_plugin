              stage="before-original-workload", verification_passed=False,
              full_v08_qualified=False,
          )
          try:
              assert record["ref"] == "refs/heads/qualification/v08-dev83-integrated"
              assert record["event_name"] in ("push", "workflow_dispatch")
              record["source_commit"] = git("rev-parse", "HEAD")
              record["source_tree"] = git("rev-parse", "HEAD^{tree}")
              assert record["source_commit"] == record["github_sha"]
              record["tracked_changes"] = git("status", "--porcelain", "--untracked-files=no")
              assert not record["tracked_changes"]
              record["workflow_sources"] = {}
              for name in (record["original_workflow"], ".github/workflows/v08-dev83-integrated.yml"):
                  actual = pathlib.Path(name).read_bytes()
                  immutable = subprocess.check_output(["git", "show", "HEAD:" + name])
                  assert actual == immutable
                  record["workflow_sources"][name] = dict(
                      git_blob=git("rev-parse", "HEAD:" + name),
                      sha256=hashlib.sha256(actual).hexdigest(),
                  )
              ide = pathlib.Path(".qualification/companion-ide")
              record["ide_checkout_expected"] = os.environ["V08_EXPECT_IDE"] == "true"
              record["ide_checkout_present"] = ide.is_dir()
              assert record["ide_checkout_present"] == record["ide_checkout_expected"]
              if record["ide_checkout_expected"]:
                  record["ide_commit"] = git("-C", str(ide), "rev-parse", "HEAD")
                  record["ide_tree"] = git("-C", str(ide), "rev-parse", "HEAD^{tree}")
                  assert record["ide_commit"] == record["expected_ide_commit"]
                  assert record["ide_tree"] == "8fb91191ead6c4fa60089763c08fc8f3959a20c3"
              record["verification_passed"] = True
          except Exception as error:
              record["verification_error"] = type(error).__name__ + ": " + str(error)
              raise
          finally:
              (output / "inputs.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: Install Qt and native JSON test headers
        run: sudo apt-get update && sudo apt-get install -y libegl1 nlohmann-json3-dev
      - name: Install test tools and pinned IDE client
        run: |
          python -m pip install -r server/requirements-test.lock
          python -m pip install --no-deps ./.qualification/companion-ide
          python -m pip install PySide6-Essentials==6.10.3

      - name: Qualify services, source inventories and worker preflight
        run: python scripts/qualify_v08_server.py
      - name: Build and smoke the isolated development package
        run: |
          python -m pip wheel --no-deps ./server --wheel-dir .qualification/v08-server/wheels
          python -m pip install --no-deps .qualification/v08-server/wheels/*.whl
          python -I -c 'import importlib.metadata as m, openbexi_spell_server as s; assert s.__version__ == m.version("openbexi-spell-server")'
          python -I -m openbexi_spell_server --help
          python -I -m openbexi_spell_server.worker --help
      - name: Retain qualification evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v08-server-foundation-${{ github.sha }}
          path: .qualification/v08-server/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain immutable input receipt including failed verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-dev83-inputs-${{ github.job }}-${{ matrix.profile || matrix.scenario || 'single' }}-${{ matrix.repetition || '0' }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/v08-dev83-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  native-boundary:
    if: github.ref == 'refs/heads/qualification/v08-dev83-integrated' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
