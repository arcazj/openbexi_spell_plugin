name: v0.8 dev83 original sanitizer hours

# Requalify only the two original hours after the exact source-pin correction.
on:
  push:
    branches: ['qualification/v08-dev83-hours']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v08-dev83-hours-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sanitized-family-endurance:
    # Keep this original ASan/UBSan, no-swap hour separate from the unchanged
    # mandatory 45-second jobs and all optimized/swap diagnostics. A successful
    # comparison cannot by itself promote any full-release gate.
    if: github.ref == 'refs/heads/qualification/v08-dev83-hours' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        scenario: [handoff, ide]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout pinned companion IDE
        if: matrix.scenario == 'ide'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: b1472b4d5a515b9082db139fb8e16b63677a052e
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Record immutable integrated qualification inputs
        if: always()
        env:
          V08_ORIGINAL_WORKFLOW: .github/workflows/v08-audit-storage.yml
          V08_ORIGINAL_JOB: sanitized-family-endurance
          V08_EXPECT_IDE: "${{ matrix.scenario == 'ide' }}"
          V08_MATRIX_JSON: ${{ toJSON(matrix) }}
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "v08-dev83-hours-inputs"
          output.mkdir(parents=True, exist_ok=True)
          record = dict(
              schema="openbexi.dev83-hours-inputs/1",
              recorded_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
              run_id=os.environ["GITHUB_RUN_ID"], run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              job=os.environ["GITHUB_JOB"], ref=os.environ["GITHUB_REF"],
              event_name=os.environ["GITHUB_EVENT_NAME"], github_sha=os.environ["GITHUB_SHA"],
              matrix=json.loads(os.environ["V08_MATRIX_JSON"] or "{}"),
              original_workflow=os.environ["V08_ORIGINAL_WORKFLOW"],
              original_job=os.environ["V08_ORIGINAL_JOB"],
              expected_ide_commit="b1472b4d5a515b9082db139fb8e16b63677a052e",
              stage="before-original-workload", verification_passed=False,
              full_v08_qualified=False,
          )
          try:
              assert record["ref"] == "refs/heads/qualification/v08-dev83-hours"
              assert record["event_name"] in ("push", "workflow_dispatch")
              record["source_commit"] = git("rev-parse", "HEAD")
              record["source_tree"] = git("rev-parse", "HEAD^{tree}")
              assert record["source_commit"] == record["github_sha"]
              record["tracked_changes"] = git("status", "--porcelain", "--untracked-files=no")
              assert not record["tracked_changes"]
              record["workflow_sources"] = {}
              for name in (record["original_workflow"], ".github/workflows/v08-dev83-hours.yml"):
                  actual = pathlib.Path(name).read_bytes()
                  immutable = subprocess.check_output(["git", "show", "HEAD:" + name])
                  assert actual == immutable
                  record["workflow_sources"][name] = dict(
                      git_blob=git("rev-parse", "HEAD:" + name),
                      sha256=hashlib.sha256(actual).hexdigest(),
                  )
              ide = pathlib.Path(".qualification/companion-ide")
              record["ide_checkout_expected"] = os.environ["V08_EXPECT_IDE"] == "true"
              record["ide_checkout_present"] = ide.is_dir()
              assert record["ide_checkout_present"] == record["ide_checkout_expected"]
              if record["ide_checkout_expected"]:
                  record["ide_commit"] = git("-C", str(ide), "rev-parse", "HEAD")
                  record["ide_tree"] = git("-C", str(ide), "rev-parse", "HEAD^{tree}")
                  assert record["ide_commit"] == record["expected_ide_commit"]
                  assert record["ide_tree"] == "8fb91191ead6c4fa60089763c08fc8f3959a20c3"
              record["verification_passed"] = True
          except Exception as error:
              record["verification_error"] = type(error).__name__ + ": " + str(error)
              raise
          finally:
              (output / "inputs.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: Install exact IDE client
        if: matrix.scenario == 'ide'
        run: python -m pip install --no-deps ./.qualification/companion-ide
      - name: Original sanitizer family, whole-cgroup accounting and retained disk audit
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python scripts/qualify_v08_memory_comparison.py --profile asan-noswap --scenario "$SCENARIO" --soak-seconds 3600
      - name: Preserve every outcome, sample, raw audit file and exact overlay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-audit-sanitized-hour-${{ matrix.scenario }}-${{ github.sha }}
          path: .qualification/v08-memory-comparison/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain immutable input receipt including failed verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-dev83-hours-inputs-${{ github.job }}-${{ matrix.profile || matrix.scenario || 'single' }}-${{ matrix.repetition || '0' }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/v08-dev83-hours-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
