name: v0.8 event replay formatter (one shot)
on:
  push:
    branches: ['feature/v0.8-server-architecture']
    paths:
      - '.github/workflows/v08-event-format-once.yml'
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'arcazj/openbexi_spell_plugin'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Format only monitoring replay changed files
        run: |
          set -euo pipefail
          python -m pip install ruff==0.14.1
          python -m ruff format server/src/openbexi_spell_server/store.py server/tests/test_services.py server/tests/test_store.py
          python -m ruff check server
          python -m ruff format --check server
          git add server/src/openbexi_spell_server/store.py server/tests/test_services.py server/tests/test_store.py
          if ! git diff --cached --quiet; then
            git -c user.name='openbexi-ci' -c user.email='17037788+arcazj@users.noreply.github.com' commit -m 'style(v0.8): format monitoring event replay'
            git push origin HEAD:feature/v0.8-server-architecture
          fi
