name: Deadline heartbeat foundation and memory attribution

on:
  push:
    branches: [diagnostic/context-followup-20261105]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeats:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - run: python -m pip install -r server/requirements-test.lock
      - name: Keep original concurrent checks and heartbeat response deadlines
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OPENBEXI_SERVER_EVIDENCE_DIR: .qualification/heartbeats
        run: |
          mkdir -p .qualification/heartbeats
          python -m pytest server/tests/test_driver_deadline_heartbeats.py server/tests/test_controller_liveness.py server/tests/test_controller_liveness_tls.py -v -W error --junitxml=.qualification/heartbeats/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heartbeat-deadlines-${{ github.sha }}
          path: .qualification/heartbeats
          include-hidden-files: true
          if-no-files-found: error

  foundation:
    needs: heartbeats
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: 08c314fb6b802b407cbabe01777072884d2b7504
          path: .qualification/companion-ide
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 nlohmann-json3-dev
          python -m pip install -r server/requirements-test.lock
          python -m pip install --no-deps ./.qualification/companion-ide
          python -m pip install PySide6-Essentials==6.10.3
      - run: python scripts/record_qualification_environment.py --profile linux-hosted-foundation --output .qualification/environment/foundation.json
      - name: Original complete suite with validated compiler flags and 600 second limit
        run: python scripts/qualify_v08_server.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deadline-foundation-${{ github.sha }}
          path: |
            .qualification/v08-server/run-*/
            .qualification/environment/
          include-hidden-files: true
          if-no-files-found: error

  memory-attribution:
    needs: heartbeats
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - name: Capture complete original 300 second Context bridge trace
        run: python scripts/profile_context_bridge_memory.py --profile asan-noswap --scenario handoff --soak-seconds 300
      - name: Preserve exact native ELF files for source bound symbolization
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, hashlib
          root=pathlib.Path('.qualification/v08-memory-comparison')
          for report in root.glob('run-*/comparison.json'):
              data=json.loads(report.read_text())
              image=data.get('candidate_worker_image')
              if not image: continue
              output=report.parent/'native-elf'
              output.mkdir(exist_ok=True)
              name=subprocess.check_output(['docker','create',image],text=True).strip()
              try:
                  subprocess.run(['docker','cp',name+':/opt/v08-native-home',str(output/'home')],check=True)
              finally:
                  subprocess.run(['docker','rm',name],check=True)
              inventory={str(p.relative_to(output)):hashlib.sha256(p.read_bytes()).hexdigest() for p in output.rglob('*') if p.is_file()}
              (output/'sha256.json').write_text(json.dumps(inventory,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-bridge-300-${{ github.sha }}
          path: .qualification/v08-memory-comparison/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
