name: v0.8 portable preparation and driver compatibility subset
on:
  push:
    branches: [feature/v0.8-server-architecture]
    paths: ['src/**', 'driver_plugin/**', 'source_port/**', 'tests/**', 'conformance/limit_features_cases.py', 'scripts/qualify_v08_compatibility.py', '.github/workflows/v08-compatibility.yml']
  pull_request:
    paths: ['src/**', 'driver_plugin/**', 'source_port/**', 'tests/**', 'conformance/limit_features_cases.py', 'scripts/qualify_v08_compatibility.py', '.github/workflows/v08-compatibility.yml']
permissions:
  contents: read
jobs:
  compatibility-subset:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned original RPC test dependencies
        run: python -m pip install pytest==8.4.2 grpcio==1.84.0 protobuf==7.36.2
      - name: Qualify portable syntax and actual protobuf TCP subset
        run: python scripts/qualify_v08_compatibility.py
      - name: Retain all results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-compatibility-subset-${{ github.sha }}
          path: .qualification/v08-compatibility/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
