name: v0.8 durable native audit storage and disk-full failure
on:
  pull_request:
    paths:
      - 'host_runtime/native/audit_file.H'
      - 'host_runtime/native/message_workers.H'
      - 'host_runtime/build_admission_context.py'
      - 'scripts/v08_audit_storage.py'
      - 'scripts/qualify_v08_audit_storage.py'
      - 'scripts/v08_native_audit_fault.py'
      - 'scripts/qualify_v08_native_launch.py'
      - 'scripts/v08_native_consumption.py'
      - 'host_runtime/python/native.py'
      - 'server/tests/*audit*'
      - '.github/workflows/v08-audit-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitized-family-endurance:
    # Keep this original ASan/UBSan, no-swap hour separate from the unchanged
    # mandatory 45-second jobs and all optimized/swap diagnostics. A successful
    # comparison cannot by itself promote any full-release gate.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        scenario: [handoff, ide]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout pinned companion IDE
        if: matrix.scenario == 'ide'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: c5edbdaecfbc08d252b87d2fb3cc18c4b27d19bc
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Install exact IDE client
        if: matrix.scenario == 'ide'
        run: python -m pip install --no-deps ./.qualification/companion-ide
      - name: Original sanitizer family, whole-cgroup accounting and retained disk audit
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python scripts/qualify_v08_memory_comparison.py --profile asan-noswap --scenario "$SCENARIO" --soak-seconds 3600
      - name: Preserve every outcome, sample, raw audit file and exact overlay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-audit-sanitized-hour-${{ matrix.scenario }}-${{ github.sha }}
          path: .qualification/v08-memory-comparison/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  actual-native-disk-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Real native Executor audit failure, immutable holds and retained records
        run: python scripts/qualify_v08_native_launch.py --native-audit-full-disk
      - name: Retain source-bound native outcome and complete fault filesystem
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-native-audit-full-${{ github.sha }}
          path: .qualification/v08-native-launch/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  disk-and-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned test tools
        run: python -m pip install pytest==8.4.2
      - name: Native audit concurrency, history, restart and kernel-limit regressions
        run: python -m pytest server/tests/test_native_audit_file.py -q --junitxml=.qualification/audit-components.xml
      - name: Real disk ENOSPC, preserved records and restart
        run: |
          set -euo pipefail
          audit_fault_root=$(mktemp -d)
          trap 'sudo umount "$audit_fault_root/mount" || true' EXIT
          truncate -s 16M "$audit_fault_root/disk.img"
          mkfs.ext4 -q -F -m 0 "$audit_fault_root/disk.img"
          mkdir "$audit_fault_root/mount"
          sudo mount -o loop,nosuid,nodev,noexec "$audit_fault_root/disk.img" "$audit_fault_root/mount"
          sudo mkdir "$audit_fault_root/mount/audit"
          sudo chown "$(id -u):$(id -g)" "$audit_fault_root/mount/audit"
          chmod 700 "$audit_fault_root/mount/audit"
          python scripts/qualify_v08_audit_storage.py --filesystem-dir "$audit_fault_root/mount/audit"
      - name: Retain records and exact-source receipts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-audit-storage-${{ github.sha }}
          path: .qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
