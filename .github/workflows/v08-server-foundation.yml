name: v0.8 internal services and prelaunch authority

on:
  pull_request:
    paths:
      - 'server/**'
      - 'docs/v0.8/**'
      - 'scripts/qualify_v08_server.py'
      - '.github/workflows/v08-server-foundation.yml'
  push:
    branches: ['feature/v0.8-server-architecture']
    paths:
      - 'server/**'
      - 'docs/v0.8/**'
      - 'scripts/qualify_v08_server.py'
      - '.github/workflows/v08-server-foundation.yml'

permissions:
  contents: read

concurrency:
  group: v08-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install -r server/requirements-test.lock
      - name: Qualify services and prelaunch authority
        run: python scripts/qualify_v08_server.py
      - name: Build and smoke the isolated development package
        run: |
          python -m pip wheel --no-deps ./server --wheel-dir .qualification/v08-server/wheels
          python -m pip install --no-deps .qualification/v08-server/wheels/*.whl
          python -I -m openbexi_spell_server --help
      - name: Retain qualification evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v08-server-foundation-${{ github.sha }}
          path: .qualification/v08-server/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
