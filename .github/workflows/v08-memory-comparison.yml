name: v0.8 isolated memory comparisons (not release qualification)

on:
  pull_request:
    paths:
      - 'scripts/*memory*'
      - 'server/tests/test_v08_memory_experiment.py'
      - 'server/tests/test_v08_native_profiles.py'
      - 'server/tests/test_v08_memory_swap_runner.py'
      - 'server/tests/test_v08_swap_device_permissions.py'
      - 'server/tests/test_native_diagnostic_log_retention.py'
      - 'scripts/v08_endurance.py'
      - 'scripts/build_v08_native_profile.py'
      - 'host_runtime/**'
      - 'scripts/qualify_v08_native_launch.py'
      - 'scripts/v08_native_consumption.py'
      - 'scripts/v08_resource_probe.py'
      - 'scripts/v08_handoff_cohort.py'
      - 'docs/v0.8/MEMORY_COMPARISON.md'
      - '.github/workflows/v08-memory-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize optional hour-long matrices on a branch. Never cancel a running
  # experiment; superseded pending workflows have no native samples to discard.
  # Mandatory per-commit acceptance keeps its separate SHA-specific group.
  group: v08-memory-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.4.2 ruff==0.14.1
      - name: Validate profiles and preserve the mandatory oracle
        run: |
          python -m ruff check scripts/v08_memory_experiment.py scripts/qualify_v08_memory_comparison.py server/tests/test_v08_memory_experiment.py host_runtime/build_native_profile.py scripts/build_v08_native_profile.py scripts/v08_endurance.py scripts/v08_memory_swap_runner.py server/tests/test_v08_native_profiles.py server/tests/test_v08_memory_swap_runner.py server/tests/test_v08_swap_device_permissions.py server/tests/test_native_diagnostic_log_retention.py
          python -m ruff format --check scripts/v08_memory_experiment.py scripts/qualify_v08_memory_comparison.py server/tests/test_v08_memory_experiment.py host_runtime/build_native_profile.py scripts/build_v08_native_profile.py scripts/v08_endurance.py scripts/v08_memory_swap_runner.py server/tests/test_v08_native_profiles.py server/tests/test_v08_memory_swap_runner.py server/tests/test_v08_swap_device_permissions.py server/tests/test_native_diagnostic_log_retention.py
          bash -n scripts/v08_memory_swap_ci.sh
          bash -n scripts/v08_memory_swap_device.sh
          PYTHONPATH=server/src:scripts:host_runtime python -m pytest -q server/tests/test_v08_memory_experiment.py server/tests/test_native_resource_probe.py server/tests/test_v08_native_profiles.py server/tests/test_v08_memory_swap_runner.py server/tests/test_v08_swap_device_permissions.py server/tests/test_native_diagnostic_log_retention.py --junitxml=.qualification/memory-profile-unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v08-memory-profile-unit-${{ github.sha }}
          path: .qualification/memory-profile-unit.xml
          if-no-files-found: error
          retention-days: 30

  comparison:
    needs: profile-regressions
    # Never enable privileged host resource setup for fork pull requests.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [asan-noswap, optimized-noswap, asan-swap, asan-o2-noswap]
        scenario: [handoff, ide]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout the same pinned companion IDE
        if: matrix.scenario == 'ide'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: c5edbdaecfbc08d252b87d2fb3cc18c4b27d19bc
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Install pinned IDE client
        if: matrix.scenario == 'ide'
        run: python -m pip install --no-deps ./.qualification/companion-ide
      - name: Install encrypted-swap utility on this disposable runner
        if: matrix.profile == 'asan-swap'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cryptsetup-bin
      - name: Execute the five-minute original-family recovery comparison
        env:
          PROFILE: ${{ matrix.profile }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == asan-swap ]]; then
            bash scripts/v08_memory_swap_ci.sh --isolate-unused-runner-swap python scripts/qualify_v08_memory_comparison.py --profile "$PROFILE" --scenario "$SCENARIO" --soak-seconds 300
          else
            python scripts/qualify_v08_memory_comparison.py --profile "$PROFILE" --scenario "$SCENARIO" --soak-seconds 300
          fi
      - name: Retain actual outcomes, failures, exact overlay and source-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-memory-${{ matrix.profile }}-${{ matrix.scenario }}-${{ github.sha }}
          path: .qualification/v08-memory-comparison/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  optimized-endurance:
    needs: profile-regressions
    # Never enable privileged host resource setup for fork pull requests.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [optimized-noswap]
        scenario: [handoff, ide]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout the same pinned companion IDE
        if: matrix.scenario == 'ide'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: c5edbdaecfbc08d252b87d2fb3cc18c4b27d19bc
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Install pinned IDE client
        if: matrix.scenario == 'ide'
        run: python -m pip install --no-deps ./.qualification/companion-ide
      - name: Install encrypted-swap utility on this disposable runner
        if: matrix.profile == 'asan-swap'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cryptsetup-bin
      - name: Execute the 60-minute same-family repeated handoff and reconnect endurance
        env:
          PROFILE: ${{ matrix.profile }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == asan-swap ]]; then
            bash scripts/v08_memory_swap_ci.sh --isolate-unused-runner-swap python scripts/qualify_v08_memory_comparison.py --profile "$PROFILE" --scenario "$SCENARIO" --soak-seconds 3600
          else
            python scripts/qualify_v08_memory_comparison.py --profile "$PROFILE" --scenario "$SCENARIO" --soak-seconds 3600
          fi
      - name: Retain actual outcomes, failures, exact overlay and source-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-endurance-${{ matrix.profile }}-${{ matrix.scenario }}-${{ github.sha }}
          path: .qualification/v08-memory-comparison/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
