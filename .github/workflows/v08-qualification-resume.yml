name: v0.8 qualification resume with published IDE 1.2.1

on:
  push:
    branches: [qualification/v08-resume-20261104]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v08-resume-${{ github.sha }}
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout the immutable published companion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: 08c314fb6b802b407cbabe01777072884d2b7504
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Install the original pinned qualification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 nlohmann-json3-dev
          python -m pip install -r server/requirements-test.lock
          python -m pip install --no-deps ./.qualification/companion-ide
          python -m pip install PySide6-Essentials==6.10.3
      - name: Record reference runner and exact dependency environment
        run: python scripts/record_qualification_environment.py --profile linux-hosted-foundation --output .qualification/environment/foundation-before.json
      - name: Run unchanged foundation commands and 600-second suite budget
        run: python scripts/qualify_v08_server.py
      - name: Record terminal runner state
        if: always()
        run: python scripts/record_qualification_environment.py --profile linux-hosted-foundation --output .qualification/environment/foundation-after.json
      - name: Retain every outcome and ordered result journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-resume-foundation-${{ github.sha }}
          path: |
            .qualification/v08-server/run-*/
            .qualification/environment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  native-original-45:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [native-handoff, native-ide]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout the exact published IDE
        if: matrix.profile == 'native-ide'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: 08c314fb6b802b407cbabe01777072884d2b7504
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Install the exact IDE client without optional UI dependencies
        if: matrix.profile == 'native-ide'
        run: python -m pip install --no-deps ./.qualification/companion-ide
      - name: Record reference runner and exact dependency environment
        run: python scripts/record_qualification_environment.py --profile linux-hosted-${{ matrix.profile }} --output .qualification/environment/native-before.json
      - name: Run original native sanitizer workload with unchanged limits
        run: python scripts/qualify_v08_native_launch.py --${{ matrix.profile }}
      - name: Record terminal runner state
        if: always()
        run: python scripts/record_qualification_environment.py --profile linux-hosted-${{ matrix.profile }} --output .qualification/environment/native-after.json
      - name: Retain receipts, samples, diagnostics and audits on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-resume-${{ matrix.profile }}-${{ github.sha }}
          path: |
            .qualification/v08-native-launch/run-*/
            .qualification/environment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
