name: v0.8 qualification with the pinned installed IDE wheel

on:
  push:
    branches: [qualification/v08-resume-20261104]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v08-resume-${{ github.sha }}
  cancel-in-progress: false

jobs:
  paired-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - name: Read the approved IDE source identity
        id: pair
        run: python -c "import json; print('commit=' + json.load(open('docs/v0.8/IDE_PAIR.json'))['ide_commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_ide
          ref: ${{ steps.pair.outputs.commit }}
          path: .qualification/companion-ide
          persist-credentials: false
      - name: Stage the exact wheel, Windows dependencies lock and desktop harness
        run: |
          python scripts/install_paired_ide.py --save-wheel .qualification/paired-wheel
          cp .qualification/companion-ide/requirements-windows-cp313.lock .qualification/companion-ide/scripts/distribution_desktop.py .qualification/paired-wheel/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-ide-wheel-${{ github.sha }}
          path: .qualification/paired-wheel/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  windows-installed:
    needs: paired-wheel
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paired-ide-wheel-${{ github.sha }}
          path: .qualification/paired-wheel
      - name: Run and debug ordinary Python with SPELL absent on fresh Windows
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .qualification/windows-venv
          python_exe=.qualification/windows-venv/Scripts/python.exe
          "$python_exe" scripts/install_paired_ide.py --wheel-dir .qualification/paired-wheel
          "$python_exe" -m pip install --report .qualification/environment/windows-dependencies.json --require-hashes --only-binary=:all: -r .qualification/paired-wheel/requirements-windows-cp313.lock
          "$python_exe" -I -c "from importlib.metadata import distributions; assert not any(d.metadata['Name'].lower().startswith('openbexi-spell') for d in distributions())"
          "$python_exe" -I .qualification/paired-wheel/distribution_desktop.py --output .qualification/windows-desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-installed-${{ github.sha }}
          path: |
            .qualification/environment/
            .qualification/windows-desktop/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  foundation:
    needs: paired-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paired-ide-wheel-${{ github.sha }}
          path: .qualification/paired-wheel
      - name: Install the original pinned qualification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 nlohmann-json3-dev
          python -m pip install -r server/requirements-test.lock
          python scripts/install_paired_ide.py --wheel-dir .qualification/paired-wheel
          python -m pip install PySide6-Essentials==6.10.3
      - name: Record reference runner and exact dependency environment
        run: python scripts/record_qualification_environment.py --profile linux-hosted-foundation --output .qualification/environment/foundation-before.json
      - name: Run unchanged foundation commands and 600-second suite budget
        run: python scripts/qualify_v08_server.py
      - name: Record terminal runner state
        if: always()
        run: python scripts/record_qualification_environment.py --profile linux-hosted-foundation --output .qualification/environment/foundation-after.json
      - name: Retain every outcome and ordered result journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-resume-foundation-${{ github.sha }}
          path: |
            .qualification/v08-server/run-*/
            .qualification/environment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  native-original-45:
    needs: paired-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [native-handoff, native-ide]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - name: Download the same IDE wheel as the Windows and Linux installs
        if: matrix.profile == 'native-ide'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paired-ide-wheel-${{ github.sha }}
          path: .qualification/paired-wheel
      - name: Install the exact IDE client without optional UI dependencies
        if: matrix.profile == 'native-ide'
        run: python scripts/install_paired_ide.py --wheel-dir .qualification/paired-wheel
      - name: Record reference runner and exact dependency environment
        run: python scripts/record_qualification_environment.py --profile linux-hosted-${{ matrix.profile }} --output .qualification/environment/native-before.json
      - name: Run original native sanitizer workload with unchanged limits
        run: python scripts/qualify_v08_native_launch.py --${{ matrix.profile }}
      - name: Record terminal runner state
        if: always()
        run: python scripts/record_qualification_environment.py --profile linux-hosted-${{ matrix.profile }} --output .qualification/environment/native-after.json
      - name: Retain receipts, samples, diagnostics and audits on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-resume-${{ matrix.profile }}-${{ github.sha }}
          path: |
            .qualification/v08-native-launch/run-*/
            .qualification/environment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
