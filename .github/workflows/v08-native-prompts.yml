name: v0.8 original native prompt lifecycle
on:
  push:
    branches: ['feature/v0.8-prompt-enabled']
    paths:
      - 'host_runtime/**'
      - 'server/**'
      - 'scripts/qualify_v08_native_prompts.py'
      - '.github/workflows/v08-native-prompts.yml'
permissions:
  contents: read
concurrency:
  group: v08-real-prompts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-prompts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Rebuild and execute original native prompt-enabled cohort
        run: PYTHONPATH=server/src python scripts/qualify_v08_native_prompts.py
      - name: Retain source-bound native results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-original-native-prompts-${{ github.sha }}
          path: .qualification/v08-native-prompts/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
