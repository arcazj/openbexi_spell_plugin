name: v0.8 retained native failure diagnosis
on:
  push:
    branches: ['feature/v0.8-server-architecture']
    paths: ['.github/workflows/v08-artifact-diagnosis.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 88efd352054de499c6d8ed1c84066eabb7f8d398
          persist-credentials: false
      - name: Verify original failed archive and emit bounded redacted diagnosis
        env:
          SPELL_DIAG_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast, hashlib, io, json, os, re, urllib.request, urllib.parse, zipfile
          from collections import Counter
          from pathlib import Path
          
          expected = "2f1ff404f691a6d15e2b60f3b56322e3fc7feca9a1dec194090036c91dc3de51"
          root = Path.cwd().resolve()
          class NoCredentialRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urllib.parse.urlsplit(newurl).scheme != "https":
                      raise ValueError("Artifact redirect must use HTTPS")
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header("Authorization")
                  return redirected
          
          request = urllib.request.Request(
              "https://api.github.com/repos/arcazj/openbexi_spell_plugin/actions/artifacts/12578346624/zip",
              headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          request.add_unredirected_header("Authorization", "Bearer " + os.environ["SPELL_DIAG_TOKEN"])
          with urllib.request.build_opener(NoCredentialRedirect()).open(request, timeout=30) as response:
              raw = response.read(5_000_001)
          assert len(raw) <= 5_000_000, "Artifact exceeds diagnostic bound"
          assert hashlib.sha256(raw).hexdigest() == expected, "Artifact digest differs"
          bundle = zipfile.ZipFile(io.BytesIO(raw))
          assert sum(info.file_size for info in bundle.infolist()) <= 20_000_000
          assert bundle.testzip() is None, "Artifact CRC differs"
          reports = [name for name in bundle.namelist() if name.endswith("/result.json")]
          assert len(reports) == 1
          report = json.loads(bundle.read(reports[0]))
          for name, wanted in report["source_sha256"].items():
              source = (root / name).resolve()
              assert source.is_relative_to(root), "Source path outside pinned checkout"
              assert hashlib.sha256(source.read_bytes()).hexdigest() == wanted, name
          
          messages, functions, filenames = set(), set(), {"agent.py"}
          for source in list((root / "server/src").rglob("*.py")) + list((root / "host_runtime").rglob("*.py")):
              filenames.add(source.name)
              tree = ast.parse(source.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      functions.add(node.name)
                  if isinstance(node, ast.Raise) and isinstance(node.exc, ast.Call):
                      for arg in node.exc.args:
                          if isinstance(arg, ast.Constant) and type(arg.value) is str and len(arg.value) <= 200:
                              messages.add(arg.value)
          for source in (root / "host_runtime/native").glob("*.H"):
              messages.update(re.findall(r'runtime_error\("([^"\n]{1,200})"\)', source.read_text()))
          messages.update({"admission_unavailable", "Native RUN consumption denied by Context admission", "Native RUN forwarding denied by Context admission", "Native Executor denied", "Native start denied", "Context admission unavailable or rejected"})
          types = {"Fault", "ValueError", "RuntimeError", "TimeoutError", "FileNotFoundError",
                   "PermissionError", "OSError", "TypeError", "KeyError", "AttributeError", "UncertainEffect"}
          safe_events = {
              "native-before-spawn-request", "native-before-spawn-admitted", "native-executor-bound",
              "native-before-forward-admitted", "native-before-forward-denied",
              "native-before-consume-admitted", "native-before-consume-denied",
              "native-before-spawn-denied", "native-unadmitted-run-denied", "native-ready",
              "native-running", "native-child-open", "native-child-running",
              "native-finished", "native-worker-failed", "native-driver-denied"}
          diagnostics = []
          for name in sorted(bundle.namelist()):
              if not name.endswith(".stdout.jsonl"):
                  continue
              counts, errors = Counter(), []
              for line in bundle.read(name).decode(errors="replace").splitlines():
                  try:
                      event = json.loads(line)
                  except (ValueError, TypeError):
                      continue
                  if type(event) is not dict or event.get("event") not in safe_events:
                      continue
                  counts[event["event"]] += 1
                  if "denied" in event["event"] or event["event"] == "native-worker-failed":
                      item = {"event": event["event"]}
                      for key in ("error", "error_type"):
                          if event.get(key) in types:
                              item[key] = event[key]
                      for key in ("reason", "code"):
                          if event.get(key) in messages:
                              item[key] = event[key]
                      causes = []
                      for cause in event.get("causes", [])[:3]:
                          if type(cause) is not dict:
                              continue
                          current = {}
                          if cause.get("type") in types:
                              current["type"] = cause["type"]
                          if cause.get("message") in messages:
                              current["fixed_message"] = cause["message"]
                          frames = []
                          for frame in cause.get("stack", [])[-8:]:
                              if (frame.get("file") in filenames and frame.get("function") in functions
                                  and type(frame.get("line")) is int and 0 < frame["line"] < 100000):
                                  frames.append({key: frame[key] for key in ("file", "line", "function")})
                          if frames:
                              current["public_source_frames"] = frames
                          causes.append(current)
                      if causes:
                          item["causes"] = causes
                      errors.append(item)
              if counts:
                  diagnostics.append({"index": len(diagnostics), "event_counts": dict(counts), "errors": errors[:16]})
          native_messages = Counter()
          for name in bundle.namelist():
              if name.endswith(".native-tail.log"):
                  tail = bundle.read(name).decode(errors="replace")
                  for message in messages:
                      if message in tail:
                          native_messages[message] += 1
          out = dict(artifact_sha256=expected, crc_verified=True, public_source_hashes_verified=len(report["source_sha256"]),
                     report_passed=report["passed"], diagnostics=diagnostics,
                     native_fixed_message_counts=dict(native_messages))
          for key in ("native_child_authority_states", "native_child_admissions_consumed", "native_child_cohort_pids"):
              value = report.get(key)
              if type(value) is int:
                  out[key] = value
              elif type(value) is list:
                  out[key] = [[state, count] for state, count in value
                              if state in {"ADMITTED", "CONSUMED", "RESTART_FENCED"}
                              and type(count) is int and 0 <= count <= 4096]
          print("REDACTED_NATIVE_DIAG=" + json.dumps(out, sort_keys=True))
          PY
