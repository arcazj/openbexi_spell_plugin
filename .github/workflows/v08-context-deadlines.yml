name: Isolated Context DSS deadlines

on:
  push:
    branches: [diagnostic/context-deadlines-20261105]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        environment: [reference-python, matched-container]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - name: Reference prerequisites
        if: matrix.environment == 'reference-python'
        run: python -m pip install -r server/requirements-test.lock
      - name: Original checks individually on reference Python
        if: matrix.environment == 'reference-python'
        run: python scripts/profile_context_deadlines.py --output .qualification/deadlines --repeat 3
      - name: Build the pinned comparison environment
        if: matrix.environment == 'matched-container'
        run: docker build -f scripts/deadline_observer/Dockerfile -t deadline-runner .
      - name: Original checks individually in matched container
        if: matrix.environment == 'matched-container'
        run: |
          mkdir -p .qualification
          docker run --init --name deadline-runner --cap-drop ALL --security-opt no-new-privileges --memory 3g --pids-limit 512 --mount type=bind,src="$PWD",dst=/workspace,readonly deadline-runner python scripts/profile_context_deadlines.py --output /evidence/deadlines --repeat 3
      - name: Collect matched container evidence including failures
        if: always() && matrix.environment == 'matched-container'
        run: docker cp deadline-runner:/evidence/deadlines .qualification/deadlines
      - name: Retain raw timings and outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-deadlines-${{ matrix.environment }}-${{ github.sha }}
          path: .qualification/deadlines
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
