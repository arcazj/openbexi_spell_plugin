[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbexi-spell-plugin"
version = "0.1.0"
description = "Optional bounded SPELL development plugin with a deterministic DSS test fixture"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
kafka = ["kafka-python==3.0.11"]
test = ["pytest==8.4.2"]

[project.scripts]
openbexi-dss = "dss.local:main"

[project.entry-points."openbexi.languages"]
spell = "openbexi_spell_plugin.runtime:activate"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
dss = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"
