[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbexi-spell-dss"
version = "0.7.0"
description = "Original SPELL RPC contracts and fenced DSS bridge"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
dependencies = ["grpcio==1.84.0", "protobuf==7.36.2"]

[project.scripts]
openbexi-spell-displays = "openbexi_spell_dss.display_viewer:main"

[project.optional-dependencies]
service = ["openbexi-spell-plugin==0.1.0", "kafka-python==3.0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbexi_spell_dss = ["contracts/*.proto", "contracts/*.json", "limit_files/*.json"]
openbexi_dss_proxy = ["_composition/manifest.json", "_composition/recipes/*.py", "_composition/original/openbexi_dss_proxy/*.py", "_composition/patched/openbexi_dss_proxy/*.py", "_composition/original/openbexi_spell_dss/*.py", "_composition/patched/openbexi_spell_dss/*.py"]
