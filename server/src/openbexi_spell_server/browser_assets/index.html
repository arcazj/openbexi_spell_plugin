<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBEXI execution workspace</title>
    <link href="/workspace/app.css" rel="stylesheet" />
    <script type="module" src="/workspace/app.js"></script>
  </head>
  <body>
    <header>
      <strong>OpenBEXI</strong><span id="identity"></span
      ><button id="connection">Disconnect</button>
    </header>
    <main>
      <h1>Execution workspace</h1>
      <div class="toolbar">
        <label>Context<select id="context"></select></label
        ><button id="refresh">Refresh</button
        ><span role="status" id="stream"></span>
      </div>
      <p role="alert" id="notice"></p>
      <section>
        <h2>Procedures</h2>
        <div class="toolbar">
          <select id="procedures" aria-label="Approved procedure"></select
          ><button id="reserve">Reserve</button>
        </div>
      </section>
      <section>
        <h2>Executions</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Procedure</th>
                <th>Controller</th>
                <th>Control state</th>
                <th>Pending request</th>
                <th>Native result</th>
              </tr>
            </thead>
            <tbody id="executions"></tbody>
          </table>
        </div>
        <div class="controls">
          <button id="rebind">Reconnect control</button
          ><button id="claim">Request control</button
          ><button id="accept">Accept request</button
          ><button id="reject">Reject request</button>
        </div>
        <div class="controls">
          <button id="start">Start native</button
          ><button id="run">Run / Continue</button
          ><button id="step">Step</button><button id="pause">Pause</button
          ><button id="abort">Abort</button
          ><button id="close">Close execution</button>
          <button id="viewprompt" hidden>View prompt</button>
        </div>
      </section>
      <section>
        <h2>Recent activity</h2>
        <ol id="activity"></ol>
      </section>
    </main>
    <dialog id="nativeprompt" aria-labelledby="prompttext">
      <h2 id="prompttext"></h2>
      <label
        >Response
        <select id="promptchoices"></select
        ><input id="promptvalue" maxlength="4096"
      /></label>
      <div class="controls">
        <button id="answer">Send answer</button>
        <button id="cancelprompt">Cancel native prompt</button>
        <button id="dismissprompt">Dismiss</button>
      </div>
    </dialog>
  </body>
</html>
