[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbexi-spell-server"
version = "0.8.0rc1"
description = "Authenticated authority, verified source catalog and worker preflight; native execution disabled"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
openbexi-spell-server = "openbexi_spell_server.__main__:main"
openbexi-spell-worker-preflight = "openbexi_spell_server.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
# This historical Git-blob fixture is verified byte-for-byte by source tests.
# Keep lint and tests active; formatting must not rewrite its frozen bytes.
exclude = ["tests/data/native_frozen_legacy_syntax.py"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
