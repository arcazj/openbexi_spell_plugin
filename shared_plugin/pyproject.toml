[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbexi-spell-shared"
version = "0.4.0.post1"
description = "Native SPELL durable Development and approved Execution provider"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["openbexi-spell-host>=0.3.0,<=0.3.1.dev1"]

[project.optional-dependencies]
dss = ["openbexi-spell-dss[service]==0.4.0"]

[project.entry-points."openbexi.shared_backends.v1"]
spell = "openbexi_spell_shared:provider"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
